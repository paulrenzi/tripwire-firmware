name: Wi-Fi detector host tools

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install analysis test dependencies
        run: python -m pip install numpy
      - name: Check launcher and Python source
        run: |
          bash -n listen.sh
          python -m compileall -q tools tests
      - name: Test stream recording, dashboard, analysis and export
        run: python -m unittest discover -s tests -v
